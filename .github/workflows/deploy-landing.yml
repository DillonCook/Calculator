name: Verify and deploy DealCooker landing site

on:
  workflow_dispatch:

concurrency:
  group: dealcooker-landing-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4.114.0"

jobs:
  deploy:
    name: Deploy dealcooker.app
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application and landing site
        run: |
          npm test
          npm run lint
          npm run build
          npm run landing:verify

      - name: Deploy landing worker
        working-directory: cloudflare/landing-worker
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy

      - name: Verify Cloudflare custom domain
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -H "X-Auth-Email: ${CLOUDFLARE_EMAIL}" \
            -H "X-Auth-Key: ${CLOUDFLARE_API_KEY}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains")"
          echo "${response}" | jq -e '.success == true' >/dev/null
          echo "${response}" | jq -r '.result[]?.hostname' | grep -qx "dealcooker.app"
          echo "Cloudflare reports dealcooker.app attached to a Worker"

      - name: Verify public landing and app routes
        shell: bash
        run: |
          set -euo pipefail
          homepage="$(curl -fsS --retry 5 --retry-delay 3 https://dealcooker.app/)"
          grep -q "Run the numbers" <<<"${homepage}"
          robots="$(curl -fsS --retry 5 --retry-delay 3 https://dealcooker.app/robots.txt)"
          grep -q "Sitemap: https://dealcooker.app/sitemap.xml" <<<"${robots}"
          sitemap="$(curl -fsS --retry 5 --retry-delay 3 https://dealcooker.app/sitemap.xml)"
          grep -q "rental-property-calculator" <<<"${sitemap}"
          grep -q "methodology" <<<"${sitemap}"
          llms="$(curl -fsS --retry 5 --retry-delay 3 https://dealcooker.app/llms.txt)"
          grep -q "Methodology](https://dealcooker.app/methodology/)" <<<"${llms}"
          grep -q "OAI-SearchBot" <<<"${robots}"
          app_headers="$(curl -fsSI --retry 5 --retry-delay 3 https://www.dealcooker.app/)"
          grep -qi '^x-robots-tag: noindex' <<<"${app_headers}"

      - name: Notify IndexNow
        shell: bash
        run: |
          set -euo pipefail
          key="f2a2e51a3452babd2382b0dc1332c80d"
          curl -fsS --retry 5 --retry-delay 3 "https://dealcooker.app/${key}.txt" | grep -qx "${key}"
          urls="$(curl -fsS --retry 5 --retry-delay 3 https://dealcooker.app/sitemap.xml | grep -oP '(?<=<loc>).*?(?=</loc>)' | jq -R . | jq -s .)"
          payload="$(jq -n --arg host "dealcooker.app" --arg key "${key}" --arg keyLocation "https://dealcooker.app/${key}.txt" --argjson urlList "${urls}" '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urlList}')"
          status="$(curl -sS -o /tmp/indexnow-response -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data "${payload}")"
          case "${status}" in 200|202) echo "IndexNow accepted ${status}" ;; *) cat /tmp/indexnow-response; exit 1 ;; esac
